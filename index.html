<style>

*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

.toast{background:#13221b;color:#fff;padding:10px 18px;border-radius:22px; box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14.5px;animation:tin .2s ease;max-width:88vw;text-align:center}

.stem{font-size:17px;line-height:1.75;margin:8px 0}

.eqblk{margin:5px 0 5px 8px}
.eqblk .eq{font-size:18.5px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle; margin:0 2px;font-style:normal;font-size:.9em;line-height:1.1}
.frac .fn{padding:0 4px 1px}
.frac .fd{padding:1px 4px 0;border-top:1.4px solid currentColor}
.sol{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}

.ansbox{margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2)}
.ansrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

.choices{display:grid;gap:9px;grid-template-columns:1fr 1fr}

.whyrow .wk{font-weight:700;color:var(--muted);margin-right:5px}
.whyrow .wm{font-weight:700;margin-left:6px;font-size:13px}
.whyrow.ok .wm{color:var(--ok)} .whyrow.no .wm{color:var(--bad)}
.whyrow .wd{color:var(--muted);font-size:13.5px;line-height:1.6;margin-top:2px}
.choice{display:flex;gap:10px;align-items:center;padding:11px 13px;border:1px solid var(--line); border-radius:var(--r);background:var(--panel);cursor:pointer;text-align:left;min-height:52px;width:100%}
.choice .k{font-weight:700;color:var(--muted);flex:0 0 auto}
.choice.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,150,105,.18)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}

.verdict{font-weight:700;margin-top:9px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qnav button{width:40px;height:40px;min-height:40px;padding:0;border-radius:9px;font-weight:600;font-size:14px}
.qnav button.cur{border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,150,105,.18)}
.qnav button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.qnav button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.qnav button.half{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line); border-radius:var(--r);background:var(--panel2);cursor:pointer;min-height:44px}

.chk input{margin:3px 0 0;width:19px;height:19px;flex:0 0 auto;min-height:auto}
.chk .t{font-weight:600;font-size:15px}
.chk .d{font-size:13px;color:var(--muted)}
.gridcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.topiccard{align-self:start}
.topiccard .chk{position:relative;flex-direction:column;align-items:stretch;padding-right:38px}
.topiccard .chk>span{display:block}

.chk .ch{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.3px; color:var(--brand);background:rgba(5,150,105,.12);border-radius:5px;padding:1px 7px;margin-bottom:5px}
.fxbtn{margin:6px 0 0 2px;font-size:12.5px;padding:3px 10px;min-height:30px; border-radius:7px;background:transparent;color:var(--muted)}

.presetbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left; padding:12px 14px;height:100%;white-space:normal;border-radius:var(--r);background:var(--panel2)}
.presetbtn .pi{font-size:22px;line-height:1.2}

</style>

<body>

<div class="stickytop noprint">

  <div id="storageWarn"></div>

</main>

<script>
"use strict";

const BUILTIN = {"url":"","studentOnly":true,"lockCloud":false,"logo":"","header":null,"about":null};
const PRISTINE_HTML = '<!doctype html>\n' + document.documentElement.outerHTML;

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function clamp(n, lo, hi) { return n < lo ? lo : n > hi ? hi : n; }

function fmt(n, dp) {
  if (n == null || !isFinite(n)) return '—';
  const d = dp == null ? 2 : dp;
  let s = Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(d).replace(/0+$/, '').replace(/\.$/, '');
  const neg = s[0] === '-'; if (neg) s = s.slice(1);
  const [i, f] = s.split('.');
  s = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
  return (neg ? '-' : '') + s;
}
function fmtq(n, dp) {
  if (n == null || !isFinite(n)) return '—';
  const d = dp == null ? 2 : dp;
  if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
  return n.toFixed(d).replace(/0+$/, '').replace(/\.$/, '');
}
function round2(n) { return Math.round(n * 100) / 100; }
function dpOf(n, max) {
  const m = max == null ? 6 : max;
  for (let d = 0; d <= m; d++) if (Math.abs(n - Number(n.toFixed(d))) < 1e-9) return d;
  return m + 1;
}
const THMON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(ts) {
  const d = new Date(ts);
  return d.getDate() + ' ' + THMON[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}
function thDateTime(ts) {
  const d = new Date(ts);
  return thDate(ts) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function mmss(sec) {
  const s = Math.max(0, Math.round(sec));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; }, 2400);
  setTimeout(() => t.remove(), 2800);
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function pickFile(accept) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept || '';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', () => { const f = inp.files[0] || null; inp.remove(); res(f); });
    inp.click();
  });
}

let modalStack = [];
function openModal(opts) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML =
    '<div class="modal"' + (opts.wide ? ' style="max-width:1000px"' : '') + '>' +

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rng(seed) {
  const f = mulberry32(seed >>> 0);
  const R = {
    f: f,
    int: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: arr => arr[Math.floor(f() * arr.length)],
    shuffle: arr => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }
  };
  return R;
}

function M(s) {
  return '<span class="eq">' + mInner(String(s)) + '</span>';
}
function mInner(raw, box) {
  const top = !box;
  box = box || [];
  const stash = html => '\u0001' + String.fromCharCode(0xE000 + (box.push(html) - 1)) + '\u0002';
  let t = String(raw);
  for (let k = 0; k < 12; k++) {
    const before = t;
    t = t.replace(/frac\(([^(),]*),([^(),]*)\)/g, (m, a, b) =>
      stash('<span class="frac"><span class="fn">' + mInner(a, box) + '</span>' +
            '<span class="fd">' + mInner(b, box) + '</span></span>'));
    if (t === before) break;
  }
  let h = esc(t);
  h = h.replace(/\^\{([^}]*)\}/g, (m, a) => '<sup>' + a + '</sup>')
       .replace(/\^(-?[\w°]+)/g, (m, a) => '<sup>' + a + '</sup>');
  h = h.replace(/_\{([^}]*)\}/g, (m, a) => '<sub>' + a + '</sub>')
       .replace(/_(-?\w)/g, (m, a) => '<sub>' + a + '</sub>');
  h = h.replace(/`([^`]*)`/g, (m, a) => '<span class="u">' + a + '</span>');
  h = h.replace(/([฀-๿]+(?:\.[฀-๿]+)*\.?)/g, '<span class="u">$1</span>');
  h = h.replace(/(\d[\d,]*\.?\d*)/g, '<span class="u">$1</span>');
  h = h.split(/(<[^>]*>)/).map(function (seg, i) {
    return i % 2 ? seg : seg.replace(/(^|\s)([+\-−×÷=≠≤≥±≈⇒→])(?=\s|$)/g,
      '$1<span class="u">$2</span>');
  }).join('');
  if (!top) return h;
  for (let k = 0; k < 20 && h.indexOf('\u0001') >= 0; k++)
    h = h.replace(/\u0001([\uE000-\uF8FF])\u0002/g, (m, c) => box[c.charCodeAt(0) - 0xE000]);
  return h;
}

function EQ() {
  return Array.from(arguments).filter(Boolean).map(s => '<div class="eqblk">' + M(s) + '</div>').join('');
}
function S(tmpl, vals, dp) {
  return String(tmpl).replace(/\{(\w+)\}/g, (m, k) => {
    if (!(k in vals)) return m;
    const v = vals[k];
    return typeof v === 'number' ? fmtq(v, dp == null ? 3 : dp) : String(v);
  });
}
function SEQ(tmpl, vals, dp) { return EQ(S(tmpl, vals, dp)); }

const TPL = [];
const TPL_BY_ID = {};

function niceProblem(p) {
  if (!p || !p.finds || !p.finds.length) return false;
  for (const f of p.finds) {
    if (typeof f.value !== 'number' || !isFinite(f.value)) return false;
    if (dpOf(f.value, 4) > 2) return false;
  }
  return true;
}

function buildProblem(tplId, seed) {
  const tpl = TPL_BY_ID[tplId];
  if (!tpl) return null;
  for (let k = 0; k < 400; k++) {
    const R = rng((seed >>> 0) + k * 7919);
    let p = null;
    try { p = tpl.gen(R); } catch (e) { continue; }
    if (!p) continue;
    if (tpl.level === THEORY_LEVEL || niceProblem(p)) return finishProblem(p, tpl, seed);
  }
  return null;
}

function finishProblem(p, tpl, seed) {
  p.tplId = tpl.id; p.seed = seed; p.topic = tpl.topic; p.level = tpl.level;
  p.sub = tpl.sub; p.skills = tpl.skills || [];
  if (tpl.level === THEORY_LEVEL) {
    p.theory = true; p.given = p.given || []; p.finds = p.finds || [];
    return p;
  }
  p.finds.forEach(f => { if (!f.kind || f.kind === 'num') f.value = round2(f.value); });
  if (tpl.level === 'ง่าย' && p.finds.length === 1) {
    p.choices = makeChoices(p, rng(((seed >>> 0) ^ 0x5bf03635) >>> 0));
  }
  return p;
}

function makeChoices(p, R) {
  const ans = round2(p.finds[0].value);
  const pool = [];
  const push = v => {
    if (typeof v !== 'number' || !isFinite(v)) return;
    const r = round2(v);
    if (Math.abs(r - ans) < 0.005 || (r <= 0 && p.finds[0].positive) || pool.some(x => Math.abs(x - r) < 0.005)) return;
    if (dpOf(r, 4) > 2) return;
    pool.push(r);
  };
  (p.distract || []).forEach(push);
  const gen = [ans * 2, ans / 2, ans + 1, ans - 1, ans * 1.5, ans / 4];
  for (const v of gen) { if (pool.length >= 6) break; push(v); }
  const picked = R.shuffle(pool).slice(0, 3);
  const all = R.shuffle(picked.concat([ans]));
  return all.map(v => ({ value: v, correct: Math.abs(v - ans) < 0.005 }));
}

        ],

/* แม่แบบที่ 3 (ปานกลาง - เติมคำตอบ): ปริมาณสารสัมพันธ์ในปฏิกิริยาเคมี */
T({
  id: 'ch-stoich-reaction-calc', topic: 106, sub: 'การคำนวณจากสมการเคมี', level: 'ปานกลาง',
  skills: ['ปริมาณสารสัมพันธ์', 'ดุลสมการเคมี', 'ปริมาตรก๊าซที่ STP'],
  gen(R) {
    const rxnTypes = [
      {
        eq: 'CaCO_3(s) + 2HCl(aq) → CaCl_2(aq) + H_2O(l) + CO_2(g)',
        reactName: 'แคลเซียมคาร์บอเนต (CaCO_3)',
        rM: 100,
        prodName: 'ก๊าซคาร์บอนไดออกไซด์ (CO_2)',
        ratio: 1,
        prodM: 44,
        weights: [10, 20, 25, 50, 75, 100, 150]
      }
    ];

    const r = R.pick(rxnTypes);
    const massIn = R.pick(r.weights);
    const molIn = massIn / r.rM;
    const molOut = molIn * r.ratio;
    const massOut = round2(molOut * r.prodM);
    const volSTP = round2(molOut * 22.4);

    if (!ok2(molIn, molOut, massOut, volSTP)) return null;

    return {
      stem: 'เมื่อนำ <b>' + esc(r.reactName) + '</b> จำนวน ' + U(massIn, 'g') +
        ' มาทำปฏิกิริยาอย่างสมบูรณ์ตามสมการเคมี:<br>' +
        EQ(r.eq) + '<br>' +
        '1) จะเกิด <b>' + esc(r.prodName) + '</b> หนักกี่กรัม (g)<br>' +
        '2) คิดเป็นปริมาตรกี่ลิตร (dm<sup>3</sup>) ที่ STP',
      given: [
        { s: 'g_{สารตั้งต้น}', v: massIn, unit: 'g', d: 'มวลของ ' + r.reactName },
        { s: 'M_{สารตั้งต้น}', v: r.rM, unit: 'g/mol', d: 'มวลโมลาร์สารตั้งต้น' },
        { s: 'M_{ผลิตภัณฑ์}', v: r.prodM, unit: 'g/mol', d: 'มวลโมลาร์ ' + r.prodName }
      ],
      finds: [
        { s: 'g_{ผลิตภัณฑ์}', unit: 'g', d: 'มวลของ ' + r.prodName, value: massOut, positive: true },
        { s: 'V_{STP}', unit: 'dm^3', d: 'ปริมาตรที่ STP', value: volSTP, positive: true }
      ],
      sol: {
        analyze: 'โจทย์ให้มวลของสารตั้งต้นมา และต้องการหาปริมาณของผลิตภัณฑ์',
        eqs: [
          { eq: 'n_{ตั้งต้น} = frac(g_{ตั้งต้น},M_{ตั้งต้น})', why: 'แปลงมวลสารตั้งต้นเป็นโมล' },
          { eq: 'g_{ผลิตภัณฑ์} = n_{ผลิตภัณฑ์} × M_{ผลิตภัณฑ์}', why: 'หามวลกรัมของผลิตภัณฑ์' },
          { eq: 'V_{STP} = n_{ผลิตภัณฑ์} × 22.4 `dm^3/mol`', why: 'ก๊าซ 1 โมล มีปริมาตร 22.4 dm^3 ที่ STP' }
        ],
        solve: [
          '<div><b>ขั้นที่ 1:</b> โมลสารตั้งต้น ' + M('n = frac(' + massIn + ',' + r.rM + ') = ' + fmtq(molIn) + ' mol') + '</div>',
          '<div><b>ขั้นที่ 2:</b> โมลผลิตภัณฑ์ ' + M('n_{ผลิตภัณฑ์} = ' + fmtq(molOut) + ' mol') + '</div>'
        ],
        subst: [
          SEQ('g_{ผลิตภัณฑ์} = {m} × {M}', { m: molOut, M: r.prodM }),
          SEQ('V_{STP} = {m} × 22.4', { m: molOut })
        ],
        calc: [
          EQ('g_{ผลิตภัณฑ์} = ' + fmtq(massOut) + ' `g`'),
          EQ('V_{STP} = ' + fmtq(volSTP) + ' `dm^3`')
        ],
        conclude: 'ดังนั้น <b>เกิด ' + esc(r.prodName) + ' หนัก ' + U(massOut, 'g') +
          ' และมีปริมาตร ' + U(volSTP, 'dm^3') + ' ที่ STP</b>'
      }
    };
  }
});

const FORMULAS = {

  106: [{ e: 'อัตราส่วนโมล: aA + bB → cC + dD', d: 'frac(n_A,a) = frac(n_B,b) = frac(n_C,c)' }]

function runPreset(key) {

function poolFor(topics, level) {
  return TPL.filter(t => topics.indexOf(t.topic) >= 0 && t.level === level);
}
function mkCfg() {
  if (!DB.settings.make) {
    DB.settings.make = { topics: ALL_TOPIC_IDS.slice(), mode: 'mix', counts: { 'ทฤษฎี': 2, 'ง่าย': 3, 'ปานกลาง': 3 } };
  }
  return DB.settings.make;
}

function createQuiz(o) {
  const R = rng(o.seed >>> 0);
  const items = [];
  const missing = [];
  LEVELS.forEach(lv => {
    const need = o.counts[lv] || 0;
    if (!need) return;
    const pool = poolFor(o.topics, lv);
    if (!pool.length) { missing.push(lv); return; }
    let bag = R.shuffle(pool);
    for (let k = 0; k < need; k++) {
      if (k % pool.length === 0 && k > 0) bag = R.shuffle(pool);
      const tpl = bag[k % pool.length];
      items.push({ tplId: tpl.id, seed: R.int(1, 2000000000), level: lv, topic: tpl.topic });
    }
  });
  if (missing.length) return { error: 'โจทย์ระดับ ' + missing.join(', ') + ' ยังมีไม่พอ' };
  return {
    id: uid(), ts: Date.now(), title: o.title, seed: o.seed,
    topics: o.topics.slice(), counts: Object.assign({}, o.counts),
    kind: o.kind || 'practice',
    items: items.map(it => ({ tplId: it.tplId, seed: it.seed }))
  };
}

const PCACHE = {};
function problemsOf(quiz) {
  if (!quiz) return [];
  const key = quiz.id;
  if (PCACHE[key]) return PCACHE[key];
  const arr = quiz.items.map(it => buildProblem(it.tplId, it.seed));
  PCACHE[key] = arr;
  return arr;
}

function startQuiz(quizId) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  const who = DB.profile.name || 'ผู้เรียน';
  const a = {
    id: uid(), quizId: q.id, soloName: who,
    startedAt: Date.now(), finishedAt: null,
    answers: q.items.map(() => ({ raw: [], pick: null, checked: false, score: 0, tries: 0, revealed: false, sec: 0 }))
  };
  DB.attempts.push(a);
  DB.cur.quizId = q.id; DB.cur.attemptId = a.id; DB.cur.i = 0;
  QT.i = -1;
  save();
  setTab('do');
}

const QT = { i: -1, t0: 0 };
function stampTime() {
  const a = curAttempt();
  if (a && QT.i >= 0 && a.answers[QT.i]) a.answers[QT.i].sec += (Date.now() - QT.t0) / 1000;
  QT.i = -1;
}
function gotoQ(i) {
  const a = curAttempt(); if (!a) return;
  stampTime();
  DB.cur.i = clamp(i, 0, a.answers.length - 1);
  QT.i = DB.cur.i; QT.t0 = Date.now();
  save(); renderDo();
}

function renderDo() {
  const a = curAttempt(), q = curQuiz();
  if (!a || !q || a.quizId !== q.id) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ยังไม่ได้เลือกชุดโจทย์</h3>' +
      '<button class="primary" onclick="setTab(\'make\')">ไปที่แท็บสร้างชุดโจทย์</button></div>';
    return;
  }
  if (a.finishedAt) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ทำชุดนี้เสร็จแล้ว</h3>' +
      '<button class="primary" onclick="setTab(\'result\')">ดูผลการประเมิน</button></div>';
    return;
  }

  const probs = problemsOf(q);
  const i = clamp(DB.cur.i, 0, probs.length - 1);
  const p = probs[i], it = a.answers[i];
  if (QT.i !== i) { QT.i = i; QT.t0 = Date.now(); }

  const done = a.answers.filter(x => x.checked).length;

  let h = '<div class="card noprint"><div class="row">' +
    '<div class="grow"><b>' + esc(q.title) + '</b>' +

    '<div class="qnav" style="margin-top:11px">' +
    a.answers.map((x, k) => {
      let cls = '';

      return '<button class="' + cls + '" data-go="' + k + '">' + (k + 1) + '</button>';
    }).join('') + '</div></div>';

  if (!p) {
    h += '<div class="card"><div class="notice bad">เกิดข้อผิดพลาดในการโหลดโจทย์ข้อนี้</div></div>';

    return;
  }

  h += '<div class="card">' + problemHead(p, i + 1) + problemBody(p);

  h += '<div class="ansbox">';
  if (p.choices) {
    h += '<div class="choices' + (p.theory ? ' txt' : '') + '">';
    p.choices.forEach((ch, k) => {

      if (it.pick === k) cls += ' sel';

        '</span></button>';
    });
    h += '</div>';
  } else {
    h += ansHintHTML(p);
    p.finds.forEach((f, k) => {

        '" id="in' + k + '" data-in="' + k + '" value="' + esc(it.raw[k] == null ? '' : it.raw[k]) + '"' + (it.checked ? ' disabled' : '') + '>' +
        '<span class="unit">' + esc(f.unit || '') + '</span></div>';
    });
  }

  if (it.checked) {
    const full = it.score >= 1;
    h += '<div class="verdict ' + (full ? 'ok' : 'bad') + '">' + (full ? '✓ ถูกต้อง' : '✗ ยังไม่ถูกต้อง') + '</div>';

    h += '<div class="row" style="margin-top:11px"><button class="primary" id="btnCheck">ตรวจคำตอบ</button>' +

  }
  h += '</div>';

  if (it.checked || it.revealed) {
    h += '<h3 style="margin:16px 0 6px">วิธีทำอย่างละเอียด (Scaffolding 7 ขั้น)</h3>' + solutionHTML(p, false);
  }

  h += '<div class="row" style="margin-top:14px">' +
    '<button id="btnPrev"' + (i === 0 ? ' disabled' : '') + '>← ข้อก่อนหน้า</button>' +
    '<button id="btnNext"' + (i === probs.length - 1 ? ' disabled' : '') + '>ข้อถัดไป →</button>' +
    '<div class="grow"></div><span class="hint">เวลาที่ใช้ข้อนี้ ' + mmss(it.sec) + '</span></div>';
  h += '</div>';

  $('#pane-do').innerHTML = h;

  $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));
  $('#btnPrev').addEventListener('click', () => gotoQ(i - 1));
  $('#btnNext').addEventListener('click', () => gotoQ(i + 1));
  $('#btnFinish').addEventListener('click', finishAttempt);
  $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
    it.pick = Number(b.dataset.pick); save(); renderDo();
  }));
  $$('[data-in]').forEach(inp => {
    inp.addEventListener('input', e => { it.raw[Number(e.target.dataset.in)] = e.target.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkCurrent(); } });
  });
  const bc = $('#btnCheck'); if (bc) bc.addEventListener('click', checkCurrent);
  const br = $('#btnReveal'); if (br) br.addEventListener('click', () => {
    it.revealed = true; save(); renderDo();
  });
  bindSolutionToggle($('#pane-do'));
}

function checkCurrent() {
  const a = curAttempt(), q = curQuiz(); if (!a || !q) return;
  const i = DB.cur.i, p = problemsOf(q)[i], it = a.answers[i];
  if (it.checked) return;
  let score = 0;
  if (p.choices) {
    if (it.pick == null) { toast('กรุณาเลือกคำตอบก่อน', 'bad'); return; }
    score = p.choices[it.pick].correct ? 1 : 0;
  } else {
    let blank = 0, hit = 0;
    p.finds.forEach((f, k) => {
      if (parseNum(it.raw[k]) == null) blank++;
      else if (checkAns(it.raw[k], f)) hit++;
    });
    if (blank === p.finds.length) { toast('กรุณากรอกคำตอบก่อน', 'bad'); return; }
    score = hit / p.finds.length;
  }
  it.checked = true; it.tries++;
  if (it.tries === 1) it.score = score;
  stampTime(); QT.i = i; QT.t0 = Date.now();
  save();
  renderDo();
  toast(score >= 1 ? 'ยอดเยี่ยม! ตอบถูกต้อง' : 'ยังไม่ถูกต้อง ลองดูเฉลยวิธีทำ 7 ขั้น', score >= 1 ? 'ok' : 'bad');
}

async function finishAttempt() {
  const a = curAttempt(); if (!a) return;
  if (!await confirmBox('ส่งแบบฝึกหัด', 'ต้องการส่งคำตอบและสรุปผลคะแนน?', 'ส่งคำตอบ')) return;
  stampTime();
  a.finishedAt = Date.now();
  save();
  setTab('result');
}

function analyze(a) {
  const q = quizOf(a);
  const probs = problemsOf(q);
  const res = { quiz: q, n: probs.length, got: 0, max: probs.length, pct: 0, sec: 0, items: [] };
  probs.forEach((p, i) => {
    const it = a.answers[i] || { score: 0, sec: 0 };
    res.got += it.score || 0;
    res.sec += it.sec || 0;
    res.items.push({ i: i, p: p, score: it.score || 0, sec: it.sec || 0 });
  });
  res.pct = res.max ? res.got / res.max * 100 : 0;
  return res;
}

function renderResult() {
  const a = curAttempt();
  if (!a || !a.finishedAt) {
    $('#pane-result').innerHTML = '<div class="card"><h3>ยังไม่มีผลการทดสอบ</h3>' +
      '<div class="hint">กรุณาทำแบบฝึกหัดและกดส่งคำตอบก่อน</div></div>';
    return;
  }
  const r = analyze(a);
  let h = '<div class="card"><h3>ผลการประเมิน — ' + esc(r.quiz.title) + '</h3>' +
    '<div class="statgrid">' +
    '<div class="stat"><div class="v">' + fmt(r.got) + ' / ' + r.max + '</div><div class="k">คะแนนที่ได้</div></div>' +
    '<div class="stat"><div class="v">' + Math.round(r.pct) + '%</div><div class="k">ร้อยละความถูกต้อง</div></div>' +
    '<div class="stat"><div class="v">' + (r.pct >= DB.settings.passPct ? 'ผ่านเกณฑ์' : 'ไม่ผ่าน') + '</div><div class="k">เกณฑ์ ' + DB.settings.passPct + '%</div></div>' +
    '<div class="stat"><div class="v">' + mmss(r.sec) + '</div><div class="k">เวลาที่ใช้รวม</div></div>' +
    '</div></div>';

  h += '<div class="card"><h3>ผลการทำรายข้อ</h3><div class="tablewrap"><table><thead><tr>' +
    '<th class="num">ข้อ</th><th>หัวข้อ</th><th>ระดับ</th><th>คะแนน</th><th>เวลา</th></tr></thead><tbody>';
  r.items.forEach(x => {
    h += '<tr><td class="num">' + (x.i + 1) + '</td><td>' + esc(x.p ? x.p.sub : '—') + '</td>' +
      '<td>' + (x.p ? x.p.level : '—') + '</td>' +
      '<td>' + (x.score >= 1 ? '<span style="color:var(--ok)">1.0</span>' : '<span style="color:var(--bad)">0.0</span>') + '</td>' +
      '<td>' + mmss(x.sec) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  $('#pane-result').innerHTML = h;
}

function renderSetting() {
  let h = '<div class="card"><h3>ตั้งค่าระบบเคมี ม.4</h3>' +
    '<div class="row"><label class="hint">เกณฑ์คะแนนผ่าน (%):</label>' +
    '<input type="number" id="setpass" min="0" max="100" value="' + DB.settings.passPct + '" style="width:90px"></div>' +
    '<div class="row" style="margin-top:14px"><button id="btnBk">สำรองข้อมูล JSON</button>' +
    '<button id="btnRs">กู้คืนข้อมูล</button></div></div>';
  $('#pane-setting').innerHTML = h;
  $('#setpass').addEventListener('change', e => { DB.settings.passPct = Number(e.target.value) || 60; save(); });
  $('#btnBk').addEventListener('click', backup);
  $('#btnRs').addEventListener('click', restore);
}

function backup() {
  download(new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' }), 'ChemQuiz_Backup.json');
  toast('สำรองข้อมูลเรียบร้อย', 'ok');
}
async function restore() {
  const f = await pickFile('.json');
  if (!f) return;
  try {
    DB = JSON.parse(await f.text());
    save(); render();
    toast('กู้คืนข้อมูลสำเร็จ', 'ok');
  } catch (e) { toast('ไฟล์ไม่ถูกต้อง', 'bad'); }
}

loadDB();
$$('#tabs button').forEach(b => b.addEventListener('click', () => {
  if (TAB === 'do') stampTime();
  setTab(b.dataset.tab);
}));
$('#btnBackup').addEventListener('click', backup);
$('#btnRestore').addEventListener('click', restore);

const a = curAttempt();
setTab(a && !a.finishedAt ? 'do' : 'make');
$('#saveState').textContent = 'พร้อมใช้งาน';
renderBrand();
</script>
</body>
</html>
