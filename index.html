<script>
"use strict";

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function clamp(n, lo, hi) { return n < lo ? lo : n > hi ? hi : n; }

function fmt(n, dp) {
  if (n == null || !isFinite(n)) return '—';
  const d = dp == null ? 2 : dp;
  let s = Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(d).replace(/0+$/, '').replace(/\.$/, '');
  const neg = s[0] === '-'; if (neg) s = s.slice(1);
  const [i, f] = s.split('.');
  s = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
  return (neg ? '-' : '') + s;
}
function fmtq(n, dp) {
  if (n == null || !isFinite(n)) return '—';
  const d = dp == null ? 2 : dp;
  if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
  return n.toFixed(d).replace(/0+$/, '').replace(/\.$/, '');
}
function round2(n) { return Math.round(n * 100) / 100; }
function dpOf(n, max) {
  const m = max == null ? 6 : max;
  for (let d = 0; d <= m; d++) if (Math.abs(n - Number(n.toFixed(d))) < 1e-9) return d;
  return m + 1;
}
const THMON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(ts) {
  const d = new Date(ts);
  return d.getDate() + ' ' + THMON[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}
function thDateTime(ts) {
  const d = new Date(ts);
  return thDate(ts) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function mmss(sec) {
  const s = Math.max(0, Math.round(sec));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; }, 2400);
  setTimeout(() => t.remove(), 2800);
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function pickFile(accept) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept || '';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', () => { const f = inp.files[0] || null; inp.remove(); res(f); });
    inp.click();
  });
}

let modalStack = [];
function openModal(opts) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML =
    '<div class="modal"' + (opts.wide ? ' style="max-width:1000px"' : '') + '>' +
      '<header>' + esc(opts.title) + '<button class="x" data-close>&times;</button></header>' +
      '<div class="body">' + (opts.bodyHTML || '') + '</div>' +
      '<footer></footer>' +
    '</div>';
  const foot = $('footer', bg);
  const close = () => { bg.remove(); modalStack = modalStack.filter(x => x !== bg); };
  (opts.buttons || [{ label: 'ปิด' }]).forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.label;

/* ============================================================================
   ENGINE & FORMATTING
   ========================================================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rng(seed) {
  const f = mulberry32(seed >>> 0);
  const R = {
    f: f,
    int: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: arr => arr[Math.floor(f() * arr.length)],
    shuffle: arr => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }
  };
  return R;
}

function M(s) {
  return '<span class="eq">' + mInner(String(s)) + '</span>';
}
function mInner(raw, box) {
  const top = !box;
  box = box || [];
  const stash = html => '\u0001' + String.fromCharCode(0xE000 + (box.push(html) - 1)) + '\u0002';
  let t = String(raw);
  for (let k = 0; k < 12; k++) {
    const before = t;
    t = t.replace(/frac\(([^(),]*),([^(),]*)\)/g, (m, a, b) =>
      stash('<span class="frac"><span class="fn">' + mInner(a, box) + '</span>' +
            '<span class="fd">' + mInner(b, box) + '</span></span>'));
    if (t === before) break;
  }
  let h = esc(t);
  h = h.replace(/\^\{([^}]*)\}/g, (m, a) => '<sup>' + a + '</sup>')
       .replace(/\^(-?[\w°]+)/g, (m, a) => '<sup>' + a + '</sup>');
  h = h.replace(/_\{([^}]*)\}/g, (m, a) => '<sub>' + a + '</sub>')
       .replace(/_(-?\w)/g, (m, a) => '<sub>' + a + '</sub>');
  h = h.replace(/`([^`]*)`/g, (m, a) => '<span class="u">' + a + '</span>');
  h = h.replace(/([฀-๿]+(?:\.[฀-๿]+)*\.?)/g, '<span class="u">$1</span>');
  h = h.replace(/(\d[\d,]*\.?\d*)/g, '<span class="u">$1</span>');
  h = h.split(/(<[^>]*>)/).map(function (seg, i) {
    return i % 2 ? seg : seg.replace(/(^|\s)([+\-−×÷=≠≤≥±≈⇒→])(?=\s|$)/g,
      '$1<span class="u">$2</span>');
  }).join('');
  if (!top) return h;
  for (let k = 0; k < 20 && h.indexOf('\u0001') >= 0; k++)
    h = h.replace(/\u0001([\uE000-\uF8FF])\u0002/g, (m, c) => box[c.charCodeAt(0) - 0xE000]);
  return h;
}

function EQ() {
  return Array.from(arguments).filter(Boolean).map(s => '<div class="eqblk">' + M(s) + '</div>').join('');
}
function S(tmpl, vals, dp) {
  return String(tmpl).replace(/\{(\w+)\}/g, (m, k) => {
    if (!(k in vals)) return m;
    const v = vals[k];
    return typeof v === 'number' ? fmtq(v, dp == null ? 3 : dp) : String(v);
  });
}
function SEQ(tmpl, vals, dp) { return EQ(S(tmpl, vals, dp)); }

const TPL = [];
const TPL_BY_ID = {};

function niceProblem(p) {
  if (!p || !p.finds || !p.finds.length) return false;
  for (const f of p.finds) {
    if (typeof f.value !== 'number' || !isFinite(f.value)) return false;
    if (dpOf(f.value, 4) > 2) return false;
  }
  return true;
}

function buildProblem(tplId, seed) {
  const tpl = TPL_BY_ID[tplId];
  if (!tpl) return null;
  for (let k = 0; k < 400; k++) {
    const R = rng((seed >>> 0) + k * 7919);
    let p = null;
    try { p = tpl.gen(R); } catch (e) { continue; }
    if (!p) continue;
    if (tpl.level === THEORY_LEVEL || niceProblem(p)) return finishProblem(p, tpl, seed);
  }
  return null;
}

function finishProblem(p, tpl, seed) {
  p.tplId = tpl.id; p.seed = seed; p.topic = tpl.topic; p.level = tpl.level;
  p.sub = tpl.sub; p.skills = tpl.skills || [];
  if (tpl.level === THEORY_LEVEL) {
    p.theory = true; p.given = p.given || []; p.finds = p.finds || [];
    return p;
  }
  p.finds.forEach(f => { if (!f.kind || f.kind === 'num') f.value = round2(f.value); });
  if (tpl.level === 'ง่าย' && p.finds.length === 1) {
    p.choices = makeChoices(p, rng(((seed >>> 0) ^ 0x5bf03635) >>> 0));
  }
  return p;
}

function makeChoices(p, R) {
  const ans = round2(p.finds[0].value);
  const pool = [];
  const push = v => {
    if (typeof v !== 'number' || !isFinite(v)) return;
    const r = round2(v);
    if (Math.abs(r - ans) < 0.005 || (r <= 0 && p.finds[0].positive) || pool.some(x => Math.abs(x - r) < 0.005)) return;
    if (dpOf(r, 4) > 2) return;
    pool.push(r);
  };
  (p.distract || []).forEach(push);
  const gen = [ans * 2, ans / 2, ans + 1, ans - 1, ans * 1.5, ans / 4];
  for (const v of gen) { if (pool.length >= 6) break; push(v); }
  const picked = R.shuffle(pool).slice(0, 3);
  const all = R.shuffle(picked.concat([ans]));
  return all.map(v => ({ value: v, correct: Math.abs(v - ans) < 0.005 }));
}

function parseAns(raw) {

}

const STEP_TITLES = ['วิเคราะห์โจทย์', 'สิ่งที่โจทย์กำหนด', 'หลักการและสูตรที่ใช้',

function givenTable(p) {

  p.given.forEach(gv => {

function stepBodies(p) {
  if (p.theory) return [p.idea, choiceWhyHTML(p), p.why];
  const s = p.sol;
  const eqHtml = (s.eqs || []).map(e =>
    '<div>' + EQ(e.eq) + (e.why ? '<div class="why">' + e.why + '</div>' : '') + '</div>').join('');
  const lines = a => (Array.isArray(a) ? a : [a]).filter(Boolean).join('');
  return [s.analyze, givenTable(p), eqHtml, lines(s.solve), lines(s.subst), lines(s.calc), s.conclude];

  const rows = [

function T(o) { TPL.push(o); TPL_BY_ID[o.id] = o; }
function TQ(o) {

}

function buildBank(topic, sub, items) {

  items.forEach((it, i) => {

      id: 'tq-' + topic + '-' + i, topic: topic, sub: sub, skills: [sub],
      gen(R) {

          stem: parse(it.q),
          choices: [ C(parse(it.c), parse(it.cw)), X(parse(it.w1), parse(it.w1w)), X(parse(it.w2), parse(it.w2w)), X(parse(it.w3), parse(it.w3w)) ],
          idea: parse(it.idea), why: parse(it.why)
        };
      }
    });
  });
}

// บทที่ 4: โมลและสูตรเคมี (104) - 10 ข้อคำนวณง่ายๆ (เราใช้ gen() สุ่มเลขได้)
function genMolCalc(sub, lvl, qfn) {
  T({ id: 'tq-104-' + uid(), topic: 104, sub: sub, level: lvl, skills: ['สูตรโมล'], gen: qfn });
}

const molSubs = [
  { n: 'น้ำ', f: '`H_2O`', M: 18, atomM: 'H=1, O=16' },
  { n: 'ก๊าซคาร์บอนไดออกไซด์', f: '`CO_2`', M: 44, atomM: 'C=12, O=16' },
  { n: 'ก๊าซมีเทน', f: '`CH_4`', M: 16, atomM: 'C=12, H=1' },
  { n: 'โซเดียมคลอไรด์', f: 'NaCl', M: 58.5, atomM: 'Na=23, Cl=35.5' },
  { n: 'แคลเซียมคาร์บอเนต', f: '`CaCO_3`', M: 100, atomM: 'Ca=40, C=12, O=16' }
];

// สร้าง 10 template ของโมล (มวล<->โมล, ปริมาตร<->โมล, อนุภาค<->โมล)
for (let i = 0; i < 3; i++) {
  // Mass to Mole
  genMolCalc('มวลและโมล', 'ง่าย', (R) => {
    const s = R.pick(molSubs);
    const m = R.pick([0.5, 1, 1.5, 2, 2.5, 3, 4, 5]);
    const g = round2(m * s.M);
    if (!ok2(m, g)) return null;
    return {
      stem: 'สารตัวอย่าง ' + esc(s.n) + ' (' + M(s.f) + ') หนัก ' + U(g, 'g') + ' คิดเป็นกี่โมล (mol)<br><span class="hint">(มวลอะตอม: ' + s.atomM + ')</span>',
      given: [{s: 'g', v: g, unit: 'g', d: 'มวล'}, {s: 'M', v: s.M, unit: 'g/mol', d: 'มวลโมลาร์'}],
      finds: [{s: 'n', unit: 'mol', value: m}], distract: [g*s.M, s.M/g, m*2],
      sol: { analyze: 'หามวล(g) เป็น โมล(mol) ใช้สูตร ' + M('n = frac(g,M)'), eqs: [{eq: 'n = frac(g,M)'}],
             solve: EQ('M = '+s.M), subst: SEQ('n = frac({g},{M})', {g:g, M:s.M}), calc: EQ('n = '+m), conclude: 'คำตอบคือ ' + m + ' mol' }
    };
  });
}
for (let i = 0; i < 3; i++) {
  // Mole to Volume STP
  genMolCalc('ปริมาตรแก๊สที่ STP', 'ง่าย', (R) => {
    const s = R.pick([molSubs[1], molSubs[2]]); // แก๊ส
    const m = R.pick([0.25, 0.5, 1.5, 2, 3]);
    const v = round2(m * 22.4);
    if (!ok2(m, v)) return null;
    return {
      stem: 'แก๊ส ' + esc(s.n) + ' (' + M(s.f) + ') จำนวน ' + U(m, 'mol') + ' จะมีปริมาตรกี่ลิตร (' + M('dm^3') + ') ที่ STP',
      given: [{s: 'n', v: m, unit: 'mol', d: 'จำนวนโมล'}],
      finds: [{s: 'V_{STP}', unit: 'dm^3', value: v}], distract: [round2(m/22.4), round2(v*2), round2(v/2)],
      sol: { analyze: 'โมล -> ปริมาตร STP ของแก๊ส ใช้สูตร ' + M('n = frac(V,22.4)'), eqs: [{eq: 'V = n \\times 22.4'}],
             solve: [], subst: SEQ('V = {m} \\times 22.4', {m:m}), calc: EQ('V = '+v), conclude: 'มีปริมาตร ' + v + ' ลิตร ที่ STP' }
    };
  });
}
for (let i = 0; i < 4; i++) {
  // Mass to Volume STP (ปานกลาง)
  genMolCalc('ความสัมพันธ์มวล ปริมาตร และโมล', 'ยาก', (R) => {
    const s = R.pick([molSubs[1], molSubs[2]]); // แก๊ส
    const m = R.pick([0.5, 1.5, 2]);
    const g = round2(m * s.M);
    const v = round2(m * 22.4);
    if (!ok2(m, g, v)) return null;
    return {
      stem: 'แก๊ส ' + esc(s.n) + ' (' + M(s.f) + ') หนัก ' + U(g, 'g') + ' จะมีปริมาตรกี่ลิตร (' + M('dm^3') + ') ที่ STP<br><span class="hint">(มวลอะตอม: ' + s.atomM + ')</span>',
      given: [{s: 'g', v: g, unit: 'g', d: 'มวล'}, {s: 'M', v: s.M, unit: 'g/mol', d: 'มวลโมลาร์'}],
      finds: [{s: 'V_{STP}', unit: 'dm^3', value: v}], distract: [round2(g*22.4), round2(v*2), round2((g/s.M)/22.4)],
      sol: { analyze: 'มวล(g) -> โมล(mol) -> ปริมาตร(V)', eqs: [{eq: 'n = frac(g,M) = frac(V,22.4)'}],
             solve: EQ('frac(g,M) = frac(V,22.4)'), subst: SEQ('frac({g},{M}) = frac(V,22.4)', {g:g, M:s.M}), calc: EQ('V = '+v), conclude: 'มีปริมาตร ' + v + ' ' + M('dm^3') + ' ที่ STP' }
    };
  });
}

const solSubs = [

    if (!ok2(C, g)) return null;
    return {
      stem: 'เตรียมสารละลาย ' + M(s.n) + ' โดยละลาย ' + M(s.n) + ' ' + U(g, 'g') + ' ในน้ำและปรับปริมาตรเป็น ' + U(V, 'cm^3') + ' สารละลายนี้มีความเข้มข้นกี่โมลต่อลิตร (mol/L หรือ M)<br><span class="hint">(มวลอะตอม: ' + s.atomM + ')</span>',

  genSolCalc('การเจือจางสารละลาย (C1V1 = C2V2)', 'ปานกลาง', (R) => {

      given: [{s: '`C_1`', v: C1, unit: 'M'}, {s: '`V_1`', v: V1, unit: 'cm^3'}, {s: '`V_2`', v: V2, unit: 'cm^3'}],
      finds: [{s: '`C_2`', unit: 'M', value: C2}], distract: [round2(C2*2), round2((C1*V2)/V1), round2((C1*V1)/(V2-V1))],

  });

function poolFor(topics, level) {
  return TPL.filter(t => topics.indexOf(t.topic) >= 0 && t.level === level);
}
function mkCfg() {
  if (!DB.settings.make) {
    DB.settings.make = { topics: ALL_TOPIC_IDS.slice(), mode: 'mix', counts: { 'ทฤษฎี': 2, 'ง่าย': 3, 'ปานกลาง': 3 } };
  }
  return DB.settings.make;
}

function createQuiz(o) {
  const R = rng(o.seed >>> 0);
  const items = [];
  const missing = [];
  LEVELS.forEach(lv => {
    const need = o.counts[lv] || 0;
    if (!need) return;
    const pool = poolFor(o.topics, lv);
      if (!pool.length) { missing.push(lv); return; }
      let bag = R.shuffle(pool);
      let theoryUsed = new Set();
      let added = 0;
      let k = 0;
      while (added < need) {
        if (k > 0 && k % pool.length === 0) bag = R.shuffle(pool);
        const tpl = bag[k % pool.length];
        k++;
        if (tpl.level === 'ทฤษฎี') {
          if (theoryUsed.has(tpl.id)) {
            let theoryCount = pool.filter(x => x.level === 'ทฤษฎี').length;
            if (theoryUsed.size >= theoryCount) {
              if (k > pool.length * 3) break;
              continue;
            }
            continue;
          }
          theoryUsed.add(tpl.id);
        }
        items.push({ tplId: tpl.id, seed: R.int(1, 2000000000), level: lv, topic: tpl.topic });
        added++;
      }
  });
  if (missing.length) return { error: 'โจทย์ระดับ ' + missing.join(', ') + ' ยังมีไม่พอ' };
  return {
    id: uid(), ts: Date.now(), title: o.title, seed: o.seed,
    topics: o.topics.slice(), counts: Object.assign({}, o.counts),
    kind: o.kind || 'practice',
    items: items.map(it => ({ tplId: it.tplId, seed: it.seed }))
  };
}

const PCACHE = {};
function problemsOf(quiz) {
  if (!quiz) return [];
  const key = quiz.id;
  if (PCACHE[key]) return PCACHE[key];
  const arr = quiz.items.map(it => buildProblem(it.tplId, it.seed));
  PCACHE[key] = arr;
  return arr;
}

    try {

      const due = new Date();
      due.setDate(due.getDate() + parseInt(days));
      const res = await apiCall('createAssignment', {
        teacherKey: 'teacher123',
        quizData: JSON.stringify(q),
        dueDate: due.toISOString()
      });
      const link = window.location.href.split('?')[0] + '?assign=' + res.assignId;
      prompt('ก๊อปปี้ลิงก์นี้ส่งให้นักเรียน:', link);
    } catch(e) { toast('เกิดข้อผิดพลาด: ' + (e.message || ''), 'bad'); }
  }

  async function showStats(quizId) {
    const assignId = prompt('ใส่รหัส Assignment ID (ที่ได้ตอนแชร์ลิงก์):', '');
    if (!assignId) return;
    try {
      toast('กำลังโหลดข้อมูล...', 'ok');
      const data = await apiCall('getAnalytics', { teacherKey: 'teacher123', assignId: assignId });
      let h = '<div class="card"><h3>สถิติการส่งงาน</h3><table style="width:100%;text-align:left"><tr><th>เลขที่</th><th>ชื่อ</th><th>คะแนน</th><th>เวลาส่ง</th></tr>';
      data.forEach(r => {
        h += '<tr><td>' + r.No + '</td><td>' + r.Name + '</td><td>' + r.Score + '</td><td>' + new Date(r.Timestamp).toLocaleString('th-TH') + '</td></tr>';
      });
      h += '</table><button class="primary" style="margin-top:20px" onclick="renderMake()">กลับ</button></div>';
      $$('.tabpane').forEach(el => el.classList.remove('active'));
    $('#pane-login').classList.add('active');
    $('#pane-login').innerHTML = h;
    } catch(e) { toast('เกิดข้อผิดพลาด: ' + (e.message || ''), 'bad'); }
  }

  async function checkUrlParams() {
    const urlParams = new URLSearchParams(window.location.search);
    const assignId = urlParams.get('assign');
    if (assignId) {
      if (DB.settings.role !== 'student') {
        showLogin();
        toast('กรุณาเข้าสู่ระบบนักเรียนเพื่อทำแบบทดสอบ', 'ok');
        return true;
      }
      try {
        toast('กำลังโหลดโจทย์...', 'ok');
        const data = await apiCall('getAssignment', { assignId: assignId });
        const q = JSON.parse(data.quizData);
        q.id = 'assign_' + assignId;
        q.title = 'การบ้าน: ' + q.title;
        DB.cur = { quizId: q.id, mode: 'do', pIdx: 0, ans: {}, q: q, assignId: assignId, dueDate: data.dueDate };
        TAB = 'do';
        render();
        toast('โหลดการบ้านสำเร็จ', 'ok');
        return true;
      } catch(e) {
        toast('ไม่พบการบ้าน หรือหมดเขตแล้ว', 'bad');
      }
    }
    return false;
  }

  function startQuiz(quizId) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  const who = DB.profile.name || 'ผู้เรียน';
  const a = {
    id: uid(), quizId: q.id, soloName: who,
    startedAt: Date.now(), finishedAt: null,
    answers: q.items.map(() => ({ raw: [], pick: null, checked: false, score: 0, tries: 0, revealed: false, sec: 0 }))
  };
  DB.attempts.push(a);
  DB.cur.quizId = q.id; DB.cur.attemptId = a.id; DB.cur.i = 0;
  QT.i = -1;
  save();
  setTab('do');
}

const QT = { i: -1, t0: 0 };
function stampTime() {
  const a = curAttempt();
  if (a && QT.i >= 0 && a.answers[QT.i]) a.answers[QT.i].sec += (Date.now() - QT.t0) / 1000;
  QT.i = -1;
}
function gotoQ(i) {
  const a = curAttempt(); if (!a) return;
  stampTime();
  DB.cur.i = clamp(i, 0, a.answers.length - 1);
  QT.i = DB.cur.i; QT.t0 = Date.now();
  save(); renderDo();
}

function renderDo() {
  const a = curAttempt(), q = curQuiz();
  if (!a || !q || a.quizId !== q.id) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ยังไม่ได้เลือกชุดโจทย์</h3>' +
      '<button class="primary" onclick="setTab(\'make\')">ไปที่แท็บสร้างชุดโจทย์</button></div>';
    return;
  }
  if (a.finishedAt) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ทำชุดนี้เสร็จแล้ว</h3>' +
      '<button class="primary" onclick="setTab(\'result\')">ดูผลการประเมิน</button></div>';
    return;
  }

  const probs = problemsOf(q);
  const i = clamp(DB.cur.i, 0, probs.length - 1);
  const p = probs[i], it = a.answers[i];
  if (QT.i !== i) { QT.i = i; QT.t0 = Date.now(); }

  const done = a.answers.filter(x => x.checked).length;

  let h = '<div class="card noprint"><div class="row">' +
    '<div class="grow"><b>' + esc(q.title) + '</b>' +
    '<div class="hint">ข้อ ' + (i + 1) + ' จาก ' + probs.length + ' · ทำแล้ว ' + done + ' ข้อ</div></div>' +
    '<button class="sm" id="btnFinish">ส่งคำตอบ / สรุปผล</button></div>' +
    '<div class="bar" style="margin-top:9px"><i style="width:' + Math.round(done / probs.length * 100) + '%"></i></div>' +
    '<div class="qnav" style="margin-top:11px">' +
    a.answers.map((x, k) => {
      let cls = '';
      if (x.checked) cls = x.score >= 1 ? 'ok' : 'bad';
      if (k === i) cls += ' cur';
      return '<button class="' + cls + '" data-go="' + k + '">' + (k + 1) + '</button>';
    }).join('') + '</div></div>';

  if (!p) {
    h += '<div class="card"><div class="notice bad">เกิดข้อผิดพลาดในการโหลดโจทย์ข้อนี้</div></div>';
    $('#pane-do').innerHTML = h;
    return;
  }

  h += '<div class="card">' + problemHead(p, i + 1) + problemBody(p);

  h += '<div class="ansbox">';
  if (p.choices) {
    h += '<div class="choices' + (p.theory ? ' txt' : '') + '">';
    p.choices.forEach((ch, k) => {
      let cls = 'choice';
      if (it.pick === k) cls += ' sel';
      if (it.checked) { if (ch.correct) cls += ' ok'; else if (it.pick === k) cls += ' bad'; }
      h += '<button class="' + cls + '" data-pick="' + k + '"' + (it.checked ? ' disabled' : '') + '>' +
        '<span class="k">' + 'กขคง'[k] + '.</span><span>' +
        (p.theory ? ch.text : M(fmt(ch.value) + (p.finds[0].unit ? ' `' + p.finds[0].unit + '`' : ''))) +
        '</span></button>';
    });
    h += '</div>';
  } else {
    h += ansHintHTML(p);
    p.finds.forEach((f, k) => {
      const okc = it.checked ? (checkAns(it.raw[k], f) ? ' ok' : ' bad') : '';
      h += '<div class="ansrow"><label class="lab" for="in' + k + '">' + M(f.s) + ' <span class="hint">' + esc(f.d) + '</span></label>' +
        '<input type="text" inputmode="decimal" class="numin' + okc +
        '" id="in' + k + '" data-in="' + k + '" value="' + esc(it.raw[k] == null ? '' : it.raw[k]) + '"' + (it.checked ? ' disabled' : '') + '>' +
        '<span class="unit">' + esc(f.unit || '') + '</span></div>';
    });
  }

  if (it.checked) {
    const full = it.score >= 1;
    h += '<div class="verdict ' + (full ? 'ok' : 'bad') + '">' + (full ? '✓ ถูกต้อง' : '✗ ยังไม่ถูกต้อง') + '</div>';
  } else {
    h += '<div class="row" style="margin-top:11px"><button class="primary" id="btnCheck">ตรวจคำตอบ</button>' +
      '<button id="btnReveal">ดูวิธีทำ 7 ขั้น</button></div>';
  }
  h += '</div>';

  if (it.checked || it.revealed) {
    h += '<h3 style="margin:16px 0 6px">วิธีทำอย่างละเอียด (Scaffolding 7 ขั้น)</h3>' + solutionHTML(p, false);
  }

  h += '<div class="row" style="margin-top:14px">' +
    '<button id="btnPrev"' + (i === 0 ? ' disabled' : '') + '>← ข้อก่อนหน้า</button>' +
    '<button id="btnNext"' + (i === probs.length - 1 ? ' disabled' : '') + '>ข้อถัดไป →</button>' +
    '<div class="grow"></div><span class="hint">เวลาที่ใช้ข้อนี้ ' + mmss(it.sec) + '</span></div>';
  h += '</div>';

  $('#pane-do').innerHTML = h;

  $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));
  $('#btnPrev').addEventListener('click', () => gotoQ(i - 1));
  $('#btnNext').addEventListener('click', () => gotoQ(i + 1));
  $('#btnFinish').addEventListener('click', finishAttempt);
  $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
    it.pick = Number(b.dataset.pick); save(); renderDo();
  }));
  $$('[data-in]').forEach(inp => {
    inp.addEventListener('input', e => { it.raw[Number(e.target.dataset.in)] = e.target.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkCurrent(); } });
  });
  const bc = $('#btnCheck'); if (bc) bc.addEventListener('click', checkCurrent);
  const br = $('#btnReveal'); if (br) br.addEventListener('click', () => {
    it.revealed = true; save(); renderDo();
  });
  bindSolutionToggle($('#pane-do'));
}

function checkCurrent() {
  const a = curAttempt(), q = curQuiz(); if (!a || !q) return;
  const i = DB.cur.i, p = problemsOf(q)[i], it = a.answers[i];
  if (it.checked) return;
  let score = 0;
  if (p.choices) {
    if (it.pick == null) { toast('กรุณาเลือกคำตอบก่อน', 'bad'); return; }
    score = p.choices[it.pick].correct ? 1 : 0;
  } else {
    let blank = 0, hit = 0;
    p.finds.forEach((f, k) => {
      if (parseNum(it.raw[k]) == null) blank++;
      else if (checkAns(it.raw[k], f)) hit++;
    });
    if (blank === p.finds.length) { toast('กรุณากรอกคำตอบก่อน', 'bad'); return; }
    score = hit / p.finds.length;
  }
  it.checked = true; it.tries++;
  if (it.tries === 1) it.score = score;
  stampTime(); QT.i = i; QT.t0 = Date.now();
  save();
  renderDo();
  toast(score >= 1 ? 'ยอดเยี่ยม! ตอบถูกต้อง' : 'ยังไม่ถูกต้อง ลองดูเฉลยวิธีทำ 7 ขั้น', score >= 1 ? 'ok' : 'bad');
}

async function finishAttempt() {
  const a = curAttempt(); if (!a) return;
  if (!await confirmBox('ส่งแบบฝึกหัด', 'ต้องการส่งคำตอบและสรุปผลคะแนน?', 'ส่งคำตอบ')) return;
  stampTime();
  a.finishedAt = Date.now();
  save();
  setTab('result');
}

function analyze(a) {
  const q = quizOf(a);
  const probs = problemsOf(q);
  const res = { quiz: q, n: probs.length, got: 0, max: probs.length, pct: 0, sec: 0, items: [] };
  probs.forEach((p, i) => {
    const it = a.answers[i] || { score: 0, sec: 0 };
    res.got += it.score || 0;
    res.sec += it.sec || 0;
    res.items.push({ i: i, p: p, score: it.score || 0, sec: it.sec || 0 });
  });
  res.pct = res.max ? res.got / res.max * 100 : 0;
  return res;
}

function renderResult() {
  const a = curAttempt();
  if (!a || !a.finishedAt) {
    $('#pane-result').innerHTML = '<div class="card"><h3>ยังไม่มีผลการทดสอบ</h3>' +
      '<div class="hint">กรุณาทำแบบฝึกหัดและกดส่งคำตอบก่อน</div></div>';
    return;
  }
  const r = analyze(a);
  let h = '<div class="card"><h3>ผลการประเมิน — ' + esc(r.quiz.title) + '</h3>' +
    '<div class="statgrid">' +
    '<div class="stat"><div class="v">' + fmt(r.got) + ' / ' + r.max + '</div><div class="k">คะแนนที่ได้</div></div>' +
    '<div class="stat"><div class="v">' + Math.round(r.pct) + '%</div><div class="k">ร้อยละความถูกต้อง</div></div>' +
    '<div class="stat"><div class="v">' + (r.pct >= DB.settings.passPct ? 'ผ่านเกณฑ์' : 'ไม่ผ่าน') + '</div><div class="k">เกณฑ์ ' + DB.settings.passPct + '%</div></div>' +
    '<div class="stat"><div class="v">' + mmss(r.sec) + '</div><div class="k">เวลาที่ใช้รวม</div></div>' +
    '</div></div>';

  h += '<div class="card"><h3>ผลการทำรายข้อ</h3><div class="tablewrap"><table><thead><tr>' +
    '<th class="num">ข้อ</th><th>หัวข้อ</th><th>ระดับ</th><th>คะแนน</th><th>เวลา</th></tr></thead><tbody>';
  r.items.forEach(x => {
    h += '<tr><td class="num">' + (x.i + 1) + '</td><td>' + esc(x.p ? x.p.sub : '—') + '</td>' +
      '<td>' + (x.p ? x.p.level : '—') + '</td>' +
      '<td>' + (x.score >= 1 ? '<span style="color:var(--ok)">1.0</span>' : '<span style="color:var(--bad)">0.0</span>') + '</td>' +
      '<td>' + mmss(x.sec) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  $('#pane-result').innerHTML = h;
}


async function renderStudents() {
  let h = '<div class="card"><h3>จัดการรายชื่อนักเรียน</h3>';
  h += '<p class="hint">นำเข้าไฟล์ Excel (.xlsx) ที่มีคอลัมน์: StudentID, Name, Class, No <a href="#" id="dlStudentTpl" style="margin-left:10px; color:var(--primary); text-decoration:underline;">[ดาวน์โหลดแม่แบบ]</a></p>';
  h += '<input type="file" id="excelFile" accept=".xlsx, .xls, .csv" style="margin-bottom:15px; display:block">';
  h += '<button class="primary" id="btnImportExcel">นำเข้าข้อมูล</button>';
  h += '<button id="btnLoadStudents" style="margin-left:10px">รีเฟรชรายชื่อ</button>';
  h += '<div id="studentTable" style="margin-top:20px"></div>';
  h += '</div>';
  
  $('#pane-students').innerHTML = h;
  
  $('#btnLoadStudents').addEventListener('click', loadStudents);
  $('#btnImportExcel').addEventListener('click', importExcel);
  $('#dlStudentTpl').addEventListener('click', (e) => {
    e.preventDefault();
    const csv = '\uFEFFStudentID,Name,Class,No\n1001,ด.ช. สมชาย ใจดี,ม.4/1,1\n1002,ด.ญ. สมหญิง รักเรียน,ม.4/1,2';
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    download(blob, 'Student_Template.csv');
  });
  
  loadStudents();
}

async function loadStudents() {
  const el = $('#studentTable');
  el.innerHTML = 'กำลังโหลดข้อมูล...';
  try {
    const students = await apiCall('getStudents', { teacherKey: 'teacher123' });
    if (!students || students.length === 0) {
      el.innerHTML = '<div class="hint">ยังไม่มีรายชื่อนักเรียนในระบบ</div>';
      return;
    }
    let th = '<div class="tablewrap"><table><thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>ชั้น</th><th>เลขที่</th></tr></thead><tbody>';
    students.forEach(s => {
      th += '<tr><td>' + esc(s.StudentID) + '</td><td>' + esc(s.Name) + '</td><td>' + esc(s.Class) + '</td><td>' + esc(s.No) + '</td></tr>';
    });
    th += '</tbody></table></div>';
    th += '<div class="hint" style="margin-top:10px">จำนวนนักเรียนทั้งหมด: ' + students.length + ' คน</div>';
    el.innerHTML = th;
  } catch (e) {
    el.innerHTML = '<div class="hint" style="color:var(--bad)">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
  }
}

function importExcel() {
  const fileInput = $('#excelFile');
  const file = fileInput.files[0];
  if (!file) {
    toast('กรุณาเลือกไฟล์ Excel ก่อน', 'bad');
    return;
  }
  
  const reader = new FileReader();
  reader.onload = async function(e) {
    const data = new Uint8Array(e.target.result);
    try {
      const workbook = XLSX.read(data, {type: 'array'});
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const json = XLSX.utils.sheet_to_json(worksheet, {raw: false});
      
      const studentsList = [];
      for (let i = 0; i < json.length; i++) {
        const row = json[i];
        // handle possible variations in column names
        const sid = row['StudentID'] || row['studentid'] || row['รหัสนักเรียน'] || row['รหัส'];
        const name = row['Name'] || row['name'] || row['ชื่อ-สกุล'] || row['ชื่อ'];
        const cls = row['Class'] || row['class'] || row['ชั้น'] || row['ห้อง'];
        const no = row['No'] || row['no'] || row['เลขที่'];
        
        if (sid && name) {
          studentsList.push({ studentId: sid, name: name, class: cls || '', no: no || '' });
        }
      }
      
      if (studentsList.length === 0) {
        toast('ไม่พบข้อมูลนักเรียน (ตรวจชื่อคอลัมน์ StudentID, Name)', 'bad');
        return;
      }
      
      toast('กำลังนำเข้า ' + studentsList.length + ' รายการ...', 'ok');
      const res = await apiCall('importStudents', { teacherKey: 'teacher123', students: studentsList });
      toast('นำเข้าข้อมูลสำเร็จ ' + res.importedCount + ' รายการ', 'ok');
      loadStudents();
    } catch(err) {
      toast('อ่านไฟล์ผิดพลาด: ' + err.message, 'bad');
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderSetting() {
  let h = '<div class="card"><h3>ตั้งค่าระบบเคมี ม.4</h3>' +
    '<div class="row" style="margin-bottom:15px; display:block"><label><b>🔗 API Endpoint (Google Web App URL):</b></label><br>' +
    '<input type="text" id="setApi" style="width:100%; padding:8px; margin-top:5px;" placeholder="https://script.google.com/..." value="' + esc(DB.settings.api || '') + '"></div>' +
    '<div class="row"><label class="hint">เกณฑ์คะแนนผ่าน (%):</label>' +
    '<input type="number" id="setpass" min="0" max="100" value="' + DB.settings.passPct + '" style="width:90px"></div>' +
    '<div class="row" style="margin-top:14px"><button id="btnBk">สำรองข้อมูล JSON</button>' +
    '<button id="btnRs">กู้คืนข้อมูล</button></div></div>';
  $('#pane-setting').innerHTML = h;
  $('#setpass').addEventListener('change', e => { DB.settings.passPct = Number(e.target.value) || 60; save(); });
  $('#setApi').addEventListener('input', e => { DB.settings.api = e.target.value.trim(); save(); });
  $('#btnBk').addEventListener('click', backup);
  $('#btnRs').addEventListener('click', restore);
}

function backup() {
  download(new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' }), 'ChemQuiz_Backup.json');
  toast('สำรองข้อมูลเรียบร้อย', 'ok');
}
async function restore() {
  const f = await pickFile('.json');
  if (!f) return;
  try {
    DB = JSON.parse(await f.text());
    save(); render();
    toast('กู้คืนข้อมูลสำเร็จ', 'ok');
  } catch (e) { toast('ไฟล์ไม่ถูกต้อง', 'bad'); }
}

loadDB();
$$('#tabs button').forEach(b => b.addEventListener('click', () => {
  if (TAB === 'do') stampTime();
  setTab(b.dataset.tab);
}));
$('#btnBackup').addEventListener('click', backup);
$('#btnRestore').addEventListener('click', restore);

const a = curAttempt();
setTab(a && !a.finishedAt ? 'do' : 'make');
$('#saveState').textContent = 'พร้อมใช้งาน';
renderBrand();
</script>
